[package]
name = "ats-opsec-suite"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ats-opsec"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
blake3 = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "alloc"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
getrandom = "0.2"
hex = "0.4"
hkdf = "0.12"
ml-kem = { version = "0.3", features = ["getrandom"] }
qrcode = "0.14"
rand = "0.9"
ratatui = "0.29"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
subtle = "2"
thiserror = "2"
toml = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
zstd = "0.13"
zxcvbn = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
